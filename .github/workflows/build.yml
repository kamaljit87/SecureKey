name: Build

# Builds SecureKey on every source-code push / PR.
# On normal pushes, the generated firmware binaries are committed
# back into the firmware/ directory for GitHub Pages to serve.
on:
  push:
    paths:
      - "06_PasswordManager/**"
      - ".github/workflows/build.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  security-events: write

jobs:

  # ============================================================
  # CodeQL SAST + Firmware Build
  #
  # CodeQL MUST observe the C/C++ compilation.
  # Therefore init -> Arduino compile -> analyze all happen
  # inside this same job.
  # ============================================================
  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest

    permissions:
      contents: write
      security-events: write

    steps:
      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # Initialize CodeQL
      # --------------------------------------------------------
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: cpp
          build-mode: manual
          queries: security-extended

      # --------------------------------------------------------
      # Install Arduino CLI
      # --------------------------------------------------------
      - name: Install arduino-cli
        run: |
          curl -L -o /tmp/arduino-cli.tar.gz \
            https://github.com/arduino/arduino-cli/releases/download/v0.35.3/arduino-cli_0.35.3_Linux_64bit.tar.gz

          mkdir -p "$HOME/bin"

          tar -xzf \
            /tmp/arduino-cli.tar.gz \
            -C "$HOME/bin"

          echo "$HOME/bin" >> "$GITHUB_PATH"

      # --------------------------------------------------------
      # Install ESP32 Arduino Core
      # --------------------------------------------------------
      - name: Install ESP32 core 2.0.16
        run: |
          arduino-cli config init

          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

          arduino-cli core update-index

          arduino-cli core install esp32:esp32@2.0.16

      # --------------------------------------------------------
      # Install libraries
      # --------------------------------------------------------
      - name: Install libraries (pinned)
        run: |
          arduino-cli lib install "NimBLE-Arduino@1.4.3"
          arduino-cli lib install "Adafruit NeoPixel"

          # ESP32 BLE Keyboard is GitHub-only.
          arduino-cli config set library.enable_unsafe_install true

          arduino-cli lib install \
            --git-url https://github.com/T-vK/ESP32-BLE-Keyboard.git

      # --------------------------------------------------------
      # Install Makerfabs Arduino_GFX fork
      # --------------------------------------------------------
      - name: Install Makerfabs Arduino_GFX fork
        run: |
          git clone \
            --depth 1 \
            --filter=blob:none \
            --sparse \
            https://github.com/Makerfabs/MaTouch-ESP32-S3-AMOLED-with-Touch-1.8-FT3168.git \
            mf

          git -C mf sparse-checkout set \
            "LVGL project/libraries/Arduino_GFX-1.3.7"

          mkdir -p "$HOME/Arduino/libraries"

          cp -r \
            "mf/LVGL project/libraries/Arduino_GFX-1.3.7" \
            "$HOME/Arduino/libraries/Arduino_GFX"

          cp \
            "06_PasswordManager/pin_config.h" \
            "$HOME/Arduino/libraries/Arduino_GFX/src/pin_config.h"

      # --------------------------------------------------------
      # Patch ESP32 BLE Keyboard
      # --------------------------------------------------------
      - name: Patch ESP32 BLE Keyboard
        run: |
          HDR="$(find "$HOME/Arduino/libraries" \
            -name BleKeyboard.h \
            | head -1)"

          SRC="$(find "$HOME/Arduino/libraries" \
            -name BleKeyboard.cpp \
            | head -1)"

          echo "Patching:"
          echo "Header: $HDR"
          echo "Source: $SRC"

          if [ -z "$HDR" ]; then
            echo "ERROR: BleKeyboard.h not found"
            exit 1
          fi

          if [ -z "$SRC" ]; then
            echo "ERROR: BleKeyboard.cpp not found"
            exit 1
          fi

          # Enable NimBLE backend.
          sed -i \
            's|^[[:space:]]*//[[:space:]]*#define USE_NIMBLE|#define USE_NIMBLE|' \
            "$HDR"

          grep -q "^#define USE_NIMBLE" "$HDR" || \
            sed -i '1i #define USE_NIMBLE' "$HDR"

          # LE Secure Connections / Just Works pairing.
          sed -i \
            's|setSecurityAuth(true, true, true)|setSecurityAuth(true, false, true)|' \
            "$SRC"

          # HID Information flags.
          sed -i \
            's|hidInfo(0x00, 0x01)|hidInfo(0x00, 0x03)|' \
            "$SRC"

      # --------------------------------------------------------
      # Show Arduino environment
      # --------------------------------------------------------
      - name: Show Arduino environment
        run: |
          arduino-cli version
          arduino-cli core list
          arduino-cli lib list

      # --------------------------------------------------------
      # Compile firmware
      #
      # IMPORTANT:
      #
      # This is AFTER CodeQL init and BEFORE CodeQL analyze.
      # This allows CodeQL to observe the C/C++ compiler.
      # --------------------------------------------------------
      - name: Compile firmware
        run: |
          rm -rf build

          arduino-cli compile \
            --output-dir build \
            --fqbn "esp32:esp32:esp32s3:PartitionScheme=app3M_fat9M_16MB,PSRAM=opi,FlashSize=16M,USBMode=default,CDCOnBoot=cdc" \
            06_PasswordManager

          echo "Build output:"
          ls -lah build

      # --------------------------------------------------------
      # CodeQL Analysis
      # --------------------------------------------------------
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:cpp"

      # --------------------------------------------------------
      # Copy firmware to firmware directory
      # --------------------------------------------------------
      - name: Copy firmware to firmware directory
        run: |
          mkdir -p firmware

          cp \
            build/06_PasswordManager.ino.bin \
            firmware/06_PasswordManager.ino.bin

          cp \
            build/06_PasswordManager.ino.bootloader.bin \
            firmware/06_PasswordManager.ino.bootloader.bin

          cp \
            build/06_PasswordManager.ino.partitions.bin \
            firmware/06_PasswordManager.ino.partitions.bin


          echo "Updated firmware:"
          ls -lah firmware

      # --------------------------------------------------------
      # Commit updated firmware
      # --------------------------------------------------------
      - name: Commit updated firmware
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add firmware/

          if git diff --cached --quiet; then
            echo "No firmware changes to commit."
            exit 0
          fi

          git commit -m "Update compiled firmware"

          git push
